# Publishes to npm when a GitHub release is published, through npm trusted publishing (OIDC, set up in the
# package settings on npmjs.com): no token, provenance is added automatically.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # trusted publishing needs npm >= 11.5.1 (Node 24 ships it); no cache in release builds
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm publish --access public
